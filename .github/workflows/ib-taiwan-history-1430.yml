name: LivingWaterAI 14h30 IB Taiwan market history
on:
  schedule:
    - cron: '30 6 * * 1-5' # 14:30 Asia/Taipei, exchange closing may be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lw-taiwan-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.1,<3' 'yfinance>=0.2.60,<2'
      - run: python -m py_compile scripts/ib_market_history_update.py
      - run: python scripts/ib_market_history_update.py --region taiwan --batch-size 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ib-taiwan-history-${{ github.run_id }}
          path: data/market_history/taiwan/
      - name: Commit dated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_history/taiwan/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh IB Taiwan market-history watchlist"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

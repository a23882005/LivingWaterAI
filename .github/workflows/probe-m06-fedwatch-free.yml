name: m06 free CME settlement research (no production changes)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_m06_fedwatch_free.py'
      - '.github/workflows/probe-m06-fedwatch-free.yml'

permissions:
  contents: read

jobs:
  probe-m06:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only dependency
        run: python -m pip install 'cme-fedwatch==0.2.1'
      - name: Probe available market settlement and compute candidate m06
        run: python scripts/probe_m06_fedwatch_free.py
      - name: Validate JSON and reveal status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/m06/fedwatch_free_probe.json').read_text())
          assert d['status'] in ('MISSING','CANDIDATE_NEEDS_REVIEW')
          print('M06_PROBE_STATUS:',d['status'])
          if d['status']=='CANDIDATE_NEEDS_REVIEW':
              print('M06_CANDIDATE:',d['m06_expected_rate_change_quarters'])
              print('SETTLEMENT_DATE:',d['as_of_settlement'])
              print('MEETING_DATE:',d['meeting_date'])
          else:
              print('DIAGNOSTIC_REASON:',d.get('error_type'),d.get('error'))
          PY
      - name: Save probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m06-free-probe
          path: build/m06/fedwatch_free_probe.json
          if-no-files-found: warn

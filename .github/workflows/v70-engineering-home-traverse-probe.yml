name: V70 short home traversal probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v70-engineering-home-traverse-probe.yml']
permissions: {}
concurrency:
  group: lw-v703-site-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test traversal for seconds and always restore original mode
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          WEB_USER: ${{ secrets.V70_ENGINEERING_USER }}
          WEB_PASSWORD: ${{ secrets.V70_ENGINEERING_PASSWORD }}
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,WEB_USER,WEB_PASSWORD
          script: |
            set -eu
            python3 - <<'PY'
            import base64, errno, http.client, os, stat, time
            from pathlib import Path
            root = Path(os.environ['LW_DIR']).resolve(strict=True)
            home = Path.home().resolve(strict=True)
            if root.name != 'public_html' or root.parent.name != 'happihelp.com' or home not in root.parents:
                raise SystemExit('ROOT_REVIEW_REQUIRED')
            if stat.S_IMODE(home.stat().st_mode) != 0o710:
                raise SystemExit('MODE_REVIEW_REQUIRED')
            try:
                os.getxattr(home, 'system.posix_acl_access')
                raise SystemExit('ACL_PRESENT_REVIEW_REQUIRED')
            except OSError as exc:
                if exc.errno not in (errno.ENODATA, errno.ENOTSUP):
                    raise
            token = base64.b64encode(os.environb[b'WEB_USER'] + b':' + os.environb[b'WEB_PASSWORD']).decode()
            def check(signed):
                conn = http.client.HTTPSConnection('www.happihelp.com', timeout=12)
                headers = {'Cache-Control':'no-cache'}
                if signed:
                    headers['Authorization'] = 'Basic ' + token
                try:
                    conn.request('GET', '/v70-engineering/index.html?traverse_probe=' + str(time.time_ns()), headers=headers)
                    response = conn.getresponse()
                    status = response.status
                    response.read()
                    return status
                finally:
                    conn.close()
            if (check(False), check(True)) != (401, 401):
                raise SystemExit('HTTPS_BASELINE_REVIEW_REQUIRED')
            try:
                os.chmod(home, 0o711)
                print('TEMP_TRAVERSE_GUEST', check(False), flush=True)
                print('TEMP_TRAVERSE_SIGNED', check(True), flush=True)
            finally:
                os.chmod(home, 0o710)
                if stat.S_IMODE(home.stat().st_mode) != 0o710:
                    raise RuntimeError('ACCOUNT_MODE_RESTORE_FAILED')
                print('ACCOUNT_MODE_RESTORED', flush=True)
            PY

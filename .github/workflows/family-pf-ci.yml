name: Family PF isolated PoC verification
on:
  push:
    branches: [family-pf-ci-20261012]
    paths:
      - '.github/workflows/family-pf-ci.yml'
      - 'experiments/family-pf-poc-20261012/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-pf-ci.yml'
      - 'experiments/family-pf-poc-20261012/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pf-full-158:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original source SHA-256
        shell: bash
        run: |
          printf '%s  %s\n' '0049a772efb7ca86452ffafc5c319d38e69ccadeb40e8fc1a2581c3506d7214b' 'experiments/family-pf-poc-20261012/PF_Local_PoC_39Tests_Source.tar.xz' | sha256sum -c -
      - name: Extract source
        shell: bash
        run: |
          mkdir -p pf-ci-source
          tar -xJf experiments/family-pf-poc-20261012/PF_Local_PoC_39Tests_Source.tar.xz -C pf-ci-source
      - name: Verify OAuth extension SHA-256 and extract
        shell: bash
        run: |
          printf '%s  %s\n' 'da59224eb417997494530c1ff8f851151b941dde30623682d7dc15362ee3841d' 'experiments/family-pf-poc-20261012/PF_OAuth_72_Extension.tar.xz' | sha256sum -c -
          tar -xJf experiments/family-pf-poc-20261012/PF_OAuth_72_Extension.tar.xz -C pf-ci-source
      - name: Apply isolated OAuth authorized-party hardening
        shell: bash
        run: |
          cp experiments/family-pf-poc-20261012/hardening_azp_75.py pf-ci-source/hardening_azp_75.py
          cd pf-ci-source
          python hardening_azp_75.py
      - name: Install synthetic MCP transport and tests
        shell: bash
        run: |
          cp experiments/family-pf-poc-20261012/pf_mcp_protocol.py pf-ci-source/pf_mcp_protocol.py
          cp experiments/family-pf-poc-20261012/test_mcp_protocol.py pf-ci-source/tests/test_mcp_protocol.py
          cp experiments/family-pf-poc-20261012/test_mcp_negative_extended.py pf-ci-source/tests/test_mcp_negative_extended.py
          cp experiments/family-pf-poc-20261012/test_mcp_request_reauthorization.py pf-ci-source/tests/test_mcp_request_reauthorization.py
          cp experiments/family-pf-poc-20261012/test_mcp_origin_security.py pf-ci-source/tests/test_mcp_origin_security.py
          cp experiments/family-pf-poc-20261012/test_mcp_oauth_discovery.py pf-ci-source/tests/test_mcp_oauth_discovery.py
          cp experiments/family-pf-poc-20261012/test_mcp_live_loopback.py pf-ci-source/tests/test_mcp_live_loopback.py
          cp experiments/family-pf-poc-20261012/pf_deployment_config.py pf-ci-source/pf_deployment_config.py
          cp experiments/family-pf-poc-20261012/test_deployment_config.py pf-ci-source/tests/test_deployment_config.py
          cp experiments/family-pf-poc-20261012/test_mcp_deployment_binding.py pf-ci-source/tests/test_mcp_deployment_binding.py
          cp experiments/family-pf-poc-20261012/pf_production_bootstrap.py pf-ci-source/pf_production_bootstrap.py
          cp experiments/family-pf-poc-20261012/test_production_bootstrap.py pf-ci-source/tests/test_production_bootstrap.py
          cp experiments/family-pf-poc-20261012/pf_gate_a_checklist.py pf-ci-source/pf_gate_a_checklist.py
          cp experiments/family-pf-poc-20261012/test_gate_a_checklist.py pf-ci-source/tests/test_gate_a_checklist.py
          cp experiments/family-pf-poc-20261012/pf_gate_a_attestation.py pf-ci-source/pf_gate_a_attestation.py
          cp experiments/family-pf-poc-20261012/test_gate_a_attestation.py pf-ci-source/tests/test_gate_a_attestation.py
          cp experiments/family-pf-poc-20261012/pf_gate_a_trust_anchor.py pf-ci-source/pf_gate_a_trust_anchor.py
          cp experiments/family-pf-poc-20261012/test_gate_a_trust_anchor.py pf-ci-source/tests/test_gate_a_trust_anchor.py
          cp experiments/family-pf-poc-20261012/pf_remote_preflight.py pf-ci-source/pf_remote_preflight.py
          cp experiments/family-pf-poc-20261012/test_remote_preflight.py pf-ci-source/tests/test_remote_preflight.py
      - name: Install test dependencies
        working-directory: pf-ci-source
        run: python -m pip install -r requirements.txt 'cryptography==46.0.4' 'uvicorn>=0.30,<1'
      - name: Run full 158-test suite
        working-directory: pf-ci-source
        env:
          PYTHONPATH: .:tests
        run: python -m pytest -q tests
      - name: Run demo
        working-directory: pf-ci-source
        env:
          PYTHONPATH: .
        run: python run_demo.py

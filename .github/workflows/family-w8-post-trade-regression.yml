name: Family W8 post-trade regression
on:
  pull_request:
    branches: [main]
    paths:
      - '系統工程/Family/W8/**'
      - '系統工程/Family/W5/family_boundary.py'
      - '系統工程/Family/W7/family_menu.py'
      - '.github/workflows/family-w8-post-trade-regression.yml'
  push:
    branches: [main]
    paths:
      - '系統工程/Family/W8/post_trade_state.py'
      - '系統工程/Family/W8/official_mutations.py'
      - '系統工程/Family/W8/official_family_entry.py'
      - '系統工程/Family/W8/tests/test_on_demand_mutations.py'
      - '系統工程/Family/W8/on_demand_mutations.py'
      - '系統工程/Family/W8/tests/test_nohost_report_menu.py'
      - '系統工程/Family/W8/tests/test_on_demand_report_delivery.py'
      - '系統工程/Family/W8/on_demand_drive_io.py'
      - '系統工程/Family/W8/tests/test_on_demand_drive_io.py'
      - '系統工程/Family/W8/on_demand_report_delivery.py'
      - '系統工程/Family/W8/tests/test_on_demand_project.py'
      - '系統工程/Family/W8/on_demand_project.py'
      - '系統工程/Family/W8/on_demand_current_sources.py'
      - '系統工程/Family/W8/on_demand_market_observations.py'
      - '系統工程/Family/W8/tests/test_market_observations.py'
      - '系統工程/Family/W8/v70_original_runtime.cjs'
      - '系統工程/Family/W8/tests/test_current_native_sources.py'
      - '系統工程/Family/W8/tests/test_on_demand_public.py'
      - '系統工程/Family/W8/on_demand_public.py'
      - '系統工程/Family/W8/tests/test_w6_member_render.py'
      - '系統工程/Family/W8/w6_member_render.py'
      - '系統工程/Family/W8/tests/test_on_demand_w6.py'
      - '系統工程/Family/W8/on_demand_w6.py'
      - '系統工程/Family/W8/tests/test_w6_current_data.py'
      - '系統工程/Family/W8/w6_current_data.py'
      - '系統工程/Family/W8/tests/test_on_demand_analysis.py'
      - '系統工程/Family/W8/on_demand_analysis.py'
      - '系統工程/Family/W8/formal_report_source.py'
      - '系統工程/Family/W8/tests/test_post_trade_state.py'
      - '系統工程/Family/W8/tests/test_formal_report_source_current.py'
      - '系統工程/Family/W8/tests/test_report_store_binding.py'
      - '系統工程/Family/W8/tests/test_official_target_readiness.py'
      - '.github/workflows/family-w8-post-trade-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Family W8 touched modules
        run: |
          python -m compileall -q '系統工程/Family/W8' '系統工程/Family/W7/family_menu.py'
      - name: Run synthetic transaction projection tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_post_trade_state.py' -v
      - name: Run on-demand investment and report binding tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_official_target_readiness.py' -v
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_report_store_binding.py' -v
      - name: Run current W6 source test
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_formal_report_source_current.py' -v
      - name: Run on-demand native W5 contract tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_analysis.py' -v
      - name: Run W6 current data assembly regressions
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_w6_current_data.py' -v
      - name: Run approved W6 data-to-renderer handoff tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_w6.py' -v
      - name: Run pinned W6 member renderer guard tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_w6_member_render.py' -v
      - name: Run no-host family login and W5 resource tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_project.py' -v
      - name: Run no-host report publish and menu tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_report_delivery.py' -v
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_nohost_report_menu.py' -v
      - name: Run current connector file_uri DB writeback tests
        env:
          PYTHONPATH: 系統工程/Family/W8
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_drive_io.py' -v
      - name: Run all five one-shot mutation handlers
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_mutations.py' -v
      - name: Run Family no-host public and account entrypoint tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_on_demand_public.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare one-shot original V70 DOM runtime
        run: npm install --prefix "$RUNNER_TEMP/family-v70" jsdom@26.1.0
      - name: Run current W1 funding intake and original V70 calculation
        env:
          NODE_PATH: ${{ runner.temp }}/family-v70/node_modules
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_current_native_sources.py' -v
      - name: Prepare pinned original numeric and V75 runtime dependencies
        run: python -m pip install -r '系統工程/Family/W5/requirements.lock'
      - name: Run member-scoped original market calculations
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_market_observations.py' -v
      - name: Run sealed official holdings source mapping
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_official_holdings_projection.py' -v
      - name: Run first-asset source and cash-only trial guards
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_native_asset_source.py' -v
      - name: Validate cash-only simulation overlays
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_loop2_cash_scenario.py' -v
      - name: Validate formal v1.0 technical source production
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_approved_v04*.py' -v
      - name: Validate v1.0 V70 source observations
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_v10_source_observations.py' -v
      - name: Run holding analysis independent of new-money deployment
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_holdings_analysis.py' -v
      - name: Validate completed-bar alternative history receipts
        run: python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_import_observed_history.py' -v
      - name: Run existing approved target input and original Family boundary
        env:
          PYTHONPATH: 系統工程/Family/W5:系統工程/Family/W5/tests
        run: |
          python -m unittest discover -s '系統工程/Family/W8/tests' -p 'test_approved_target_input.py' -v
          python -m pytest '系統工程/Family/W5/tests/test_family_boundary.py' '系統工程/Family/W5/tests/test_family_runner.py' '系統工程/Family/W5/tests/test_c7_engine.py' -q
          python -m pytest '系統工程/Family/W5/tests/test_family_technical.py' '系統工程/Family/W5/tests/test_technical_source_bridge.py' -q


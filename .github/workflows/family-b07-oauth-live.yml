name: Family B07 OAuth Drive integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-b07-oauth-live.yml'
      - '系統工程/Family/W7/probes/b07_oauth_integration.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-b04-temp-drive-writer
  cancel-in-progress: false
jobs:
  oauth-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
      FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
      FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: OAuth to B06 to approved synthetic Drive TEMP
        run: python 系統工程/Family/W7/probes/b07_oauth_integration.py verify
      - name: Restore exact TEMP baseline
        if: always()
        run: python 系統工程/Family/W7/probes/b07_oauth_integration.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-b07-oauth-live-${{ github.run_id }}
          path: build/family-b07-oauth-live/*.json
          if-no-files-found: error

name: V82-watch-mail temporary QA
on:
  push:
    branches: ['fix/v82-watch-actionable-only-20261118']
    paths:
      - 'research/yahoo_watch_candidate/**'
      - '.github/workflows/v82-watch-mail-qa-temp.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing V82 watch regression suite offline
        run: python research/yahoo_watch_candidate/run_tests.py

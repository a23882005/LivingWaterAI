# Read-only live test of the EXACT formal 18 independent macro collector.
# No verified override, no stale-cache fallback, no production push/deploy, no credentials.
name: V70 Formal Core18 Actual Free Source Fetch 20261106
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/v70-core18-free-source-probe-20261106.yml'
permissions:
  contents: read
jobs:
  core18-readonly:
    if: github.event.pull_request.head.ref == 'test/v70-free-sources-probe-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing crawler libraries
        run: python -m pip install --disable-pip-version-check -q requests 'pandas>=2.1,<3' yfinance pypdf
      - name: Fetch formal 18 independent sources with no API key, cache or manual override
        timeout-minutes: 12
        env:
          FRED_API_KEY: ''
          CME_FEDWATCH_BEARER: ''
          BARCHART_ONDEMAND_API_KEY: ''
        run: |
          mkdir -p build/v70_core18_probe
          printf '{}\n' > build/v70_core18_probe/empty_verified_overrides.json
          python -u '系統工程/總經V70/總經爬蟲18項.py' --out build/v70_core18_probe --overrides build/v70_core18_probe/empty_verified_overrides.json
      - name: Verify 18 core ids and retain actual retrieval status for each
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('build/v70_core18_probe')
          file=root/'18_macro_verification.json'
          if not file.is_file():
              print('CORE18_NO_OUTPUT: collector stopped before writing JSON')
              sys.exit(1)
          d=json.loads(file.read_text(encoding='utf-8'))
          rows=d['items'];ids=[k for k in rows if k!='s03']
          assert len(rows)==19 and len(ids)==18 and d['independent_indicators']['total']==18
          summary={'schema':'V70_CORE18_REAL_FETCH_CHECK_v1','generated_at':d.get('generated_at'),
                   'total_independent':18,'duplicate_transport':'s03',
                   'fresh_source_success':sum(rows[k].get('attempt_result')=='SUCCESS' and not rows[k].get('cache_used') for k in ids),
                   'strict_status_OK':sum(rows[k].get('status')=='OK' for k in ids),
                   'rows':[{field:(v if field!='value' else v) for field,v in row.items() if field in ('id','label','status','value','unit','observation_date','method','source_url','attempt_result','cache_used','error','retrieval_error','detail')}
                           for k,row in rows.items() if k!='s03']}
          print('CORE18_SUMMARY',json.dumps({k:v for k,v in summary.items() if k!='rows'},ensure_ascii=False),flush=True)
          for r in summary['rows']:
              print('CORE18_ROW',json.dumps(r,ensure_ascii=False,sort_keys=True),flush=True)
          (root/'core18_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/validate_macro18_outputs.py build/v70_core18_probe
      - name: Save real results (not production publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v70-formal-core18-readonly-results
          path: build/v70_core18_probe/
          if-no-files-found: warn
          retention-days: 7

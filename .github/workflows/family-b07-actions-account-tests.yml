name: Family B07 Actions account job tests
on:
  push:
    branches: [family/actions-account-job-20261024]
    paths:
      - '系統工程/Family/W7/actions_account_job.py'
      - '系統工程/Family/W7/tests/test_actions_account_job.py'
      - '.github/workflows/family-b07-actions-account-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-job-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: Synthetic account job and core regression
        run: python -m pytest 系統工程/Family/W7/tests/test_actions_account_job.py 系統工程/Family/W7/tests/test_accounts.py 系統工程/Family/W7/tests/test_account_oauth.py 系統工程/Family/W7/tests/test_account_http.py -q --tb=short

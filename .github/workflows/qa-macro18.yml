name: V70.3 18 Macro Collector QA
on:
  workflow_dispatch:
  push:
    paths:
      - '系統工程/總經V70/總經18項爬蟲.py'
      - '.github/workflows/qa-macro18.yml'
permissions:
  contents: read
jobs:
  audit18:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pandas
      - name: Syntax and offline 18-field QA
        run: |
          python -m py_compile '系統工程/總經V70/總經18項爬蟲.py'
          python '系統工程/總經V70/總經18項爬蟲.py' --self-test
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('系統工程/總經V70/總經18項爬蟲.py')
          tree=ast.parse(p.read_text(encoding='utf-8'))
          assignments=[n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='LABELS' for t in n.targets)]
          labels=ast.literal_eval(assignments[0].value)
          excluded={'m06','m03_qqq','m03_spy','m03_vt','s05'}
          assert len(labels)==19 and len(set(labels)-{'s03'})==18
          assert not excluded.intersection(labels)
          print('V70.3 18-INDEPENDENT QA PASS; 5 delegated Gemini/Gmail ids absent')
          PY

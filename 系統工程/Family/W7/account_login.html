<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="family-csrf" content="__CSRF__"><title>Family 帳號登入</title>
<style nonce="__NONCE__">body{font:18px system-ui,sans-serif;background:#f3f7f5;color:#163e32;margin:0;padding:24px}main{max-width:560px;margin:auto}section{background:white;padding:24px;border-radius:16px;margin:20px 0;border:1px solid #c9d9d1}h1{font-size:28px}h2{font-size:22px}label{display:block;margin:14px 0}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #829d90}button{background:#225b47;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.55}small{display:block;line-height:1.6}#status{padding:16px;background:#e3eee9;border-radius:10px;white-space:pre-wrap}details{margin-top:24px}</style>
</head><body><main><h1>Family 帳號登入</h1><p>登入有效四小時，期間操作與保存資料共用這次登入。</p>
<p id="status" role="status" aria-live="polite">請輸入自己的帳號與密碼。</p>
<section><h2>登入</h2><form data-path="login"><label>帳號<input name="user_id" autocomplete="username" required maxlength="80"></label><label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登入</button></form><button id="session">查看登入狀態</button><button id="logout">登出</button></section>
<section><h2>啟用帳號／修改密碼</h2><small>首次登入後，在這裡將初始密碼改成自己的密碼。改好後請用新密碼登入。</small><form data-path="change-password"><label>目前密碼<input name="current_password" type="password" autocomplete="current-password" required maxlength="256"></label><label>新密碼<input name="new_password" type="password" autocomplete="new-password" required maxlength="256"></label><button>更新自己的密碼</button></form></section>
<details><summary>管理者帳號管理</summary><section><form data-path="manage"><label>操作<select name="operation"><option value="create">建立帳號</option><option value="reset">重設密碼</option><option value="disable">停用帳號</option><option value="enable">啟用帳號</option></select></label><label>目標帳號<input name="user_id" required maxlength="80" autocomplete="off"></label><label>初始／重設密碼<input name="password" type="password" maxlength="256" autocomplete="new-password"></label><label>角色<select name="role"><option value="member">家人</option><option value="manager">帳號管理者</option></select></label><small>初始／重設密碼有效一小時，首次登入需要改密碼。</small><button>執行管理操作</button></form></section></details>
<script nonce="__NONCE__">
const status=document.querySelector('#status');
const csrf=document.querySelector('meta[name="family-csrf"]').content;
const base=location.pathname.replace(/\/$/,'').replace(/\/index\.php$/,'');
const messages={AUTH_REQUIRED:'請確認帳密，或重新登入。',PASSWORD_CHANGE_REQUIRED:'請先修改初始密碼。',TRY_LATER:'請稍候一分鐘再試。',CSRF_REQUIRED:'頁面已逾時，請重新整理。',SERVICE_RETRY:'服務暫時忙碌，請稍後再試。'};
async function request(path,body){
 const options={credentials:'same-origin',headers:{}};
 if(body){options.method='POST';options.headers={'Content-Type':'application/json','X-Family-CSRF':csrf};options.body=JSON.stringify({...body,request_id:crypto.randomUUID()});}
 status.textContent='處理中，請稍候…';
 try{const response=await fetch(base+'/index.php/'+path,options);const value=await response.json();
 if(!response.ok){status.textContent=messages[value.error]||'請檢查輸入內容後再試。';return;}
 const r=value.result;
 if(r.must_change)status.textContent='登入成功，請在下方修改初始密碼。';
 else if(r.expires_at)status.textContent=(r.user_id?r.user_id+'，':'')+'登入有效至 '+new Date(r.expires_at*1000).toLocaleString('zh-TW');
 else if(r.password_changed)status.textContent='密碼已更新，請用新密碼登入。';
 else if(r.logged_out)status.textContent='已登出。';
 else status.textContent='帳號管理操作已完成。';
 }catch(e){status.textContent='連線暫時中斷，請稍後重試。';}
}
document.querySelectorAll('form').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;const data=Object.fromEntries(new FormData(form));if(form.dataset.path==='manage'){data.until=Math.floor(Date.now()/1000)+3600;if(!data.password)data.password=null;}
try{await request(form.dataset.path,data);}finally{form.querySelectorAll('input[type=password]').forEach(x=>x.value='');button.disabled=false;}}));
document.querySelector('#session').onclick=()=>request('session');
document.querySelector('#logout').onclick=()=>request('logout',{});
</script></main></body></html>

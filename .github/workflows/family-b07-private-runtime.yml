name: Family B07 private persistent runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-b07-private-runtime.yml'
      - '系統工程/Family/W7/deployment/provision_private_runtime.py'
      - '系統工程/Family/W7/private_runtime.py'
      - '系統工程/Family/W7/tests/test_private_runtime.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-b07-private-runtime-provision
  cancel-in-progress: false
jobs:
  provision:
    # Family architecture: GitHub code + Drive data + ChatGPT on-demand.
    # Permanently prevent Hostinger deployment, including manual dispatch.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
      LW_RUN: ${{ github.run_id }}
      LW_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest 系統工程/Family/W7/tests/test_private_runtime.py 系統工程/Family/W7/tests/test_private_service_config.py -q
      - name: Prepare private configuration from approved Drive mapping
        env:
          FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
          FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
          FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
        run: python 系統工程/Family/W7/deployment/provision_private_runtime.py build
      - name: Prepare exclusive private staging directory
        id: staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,LW_RUN,LW_ATTEMPT
          script: |
            set -eu
            umask 077
            case "${LW_DIR%/}" in public_html|*/public_html) ;; *) exit 1 ;; esac
            case "$LW_RUN-$LW_ATTEMPT" in *[!0-9-]*) exit 1 ;; esac
            stage="$(dirname "${LW_DIR%/}")/.family-b07-provision-$LW_RUN-$LW_ATTEMPT"
            test ! -e "$stage"
            mkdir -m 700 "$stage"
      - name: Upload private installer
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          source: build/family-b07-runtime/private/*
          target: ${{ vars.HOSTINGER_SITE_DIRECTORY }}/../.family-b07-provision-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 3
          command_timeout: 90s
      - name: Provision stable key and disabled private configuration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,LW_RUN,LW_ATTEMPT
          script: |
            set -eu
            umask 077
            parent="$(dirname "${LW_DIR%/}")"
            stage="$parent/.family-b07-provision-$LW_RUN-$LW_ATTEMPT"
            chmod 600 "$stage/input.json"
            python3 "$stage/provision_private_runtime.py" install "$parent/.family-b07-service"
      - name: Remove exclusive staging secrets
        if: always() && steps.staging.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,LW_RUN,LW_ATTEMPT
          script: |
            set -eu
            parent="$(dirname "${LW_DIR%/}")"
            python3 - "$parent/.family-b07-provision-$LW_RUN-$LW_ATTEMPT" "$LW_RUN-$LW_ATTEMPT" <<'PY'
            import pathlib,shutil,sys
            folder=pathlib.Path(sys.argv[1])
            assert folder.name=='.family-b07-provision-'+sys.argv[2]
            assert not folder.is_symlink()
            if folder.exists():shutil.rmtree(folder)
            print('PRIVATE_STAGING_CLEANUP_PASS')
            PY
      - name: Remove runner secrets
        if: always()
        run: rm -rf -- build/family-b07-runtime/private

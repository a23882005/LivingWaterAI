# 最後修改日期時間：2026/10/19 08:27（台灣時間）｜檔案名稱：v703-site-deploy-1100.yml｜版本：部署驗證七張研究圖、封存每日與月度 Macro Safety 資料
# 2026/10/19 V70 正式版通知：唯一來源 系統工程/總經V70/V70-3-27.html；債券 B1-B4 深墨綠可讀性修正；部署必須通過 25/28/26/22 品質閘門與線上讀回。
name: LivingWaterAI 11h Verified V70.3 Site Deploy
on:
  schedule:
    - cron: '0 3 * * *' # Daily 11:00 Asia/Taipei (UTC 03:00)
  workflow_dispatch:
  push:
    paths:
      - '系統工程/總經V70/V70-3-27.html'
      - 'scripts/build_daily_v703_site.py'
      - 'scripts/capture_v703_daily_snapshot.py'
      - 'scripts/monthly_research/macro_safety_monthly.py'
      - 'scripts/monthly_research/build_bank_macro_monthly.py'
      - 'experiments/macro-safety-monthly-research/bank_forecast_register_research.csv'
      - 'tests/test_macro_safety_monthly.py'
      - 'tests/test_bank_macro_monthly.py'
      - '.github/workflows/v703-site-deploy-1100.yml'
      - 'data/18_macro_verification.json'
      - 'data/8_macro_supplement_verified.json'
      - 'data/v703_official_monthly_release_calendar.json'
permissions:
  contents: write
concurrency:
  group: lw-v703-site-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    # Exact one-off verified repair merge may trigger deployment; unrelated pushes remain skipped.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'fix(v703): deploy') || startsWith(github.event.head_commit.message, 'fix(v703): synchronize canonical')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 18 core plus 8 supplement inputs; build V70-3-27
        run: |
          python -m py_compile scripts/build_daily_v703_site.py
          test -s data/18_macro_verification.json
          test -s data/8_macro_supplement_verified.json
          test -s data/v703_official_monthly_release_calendar.json
          python -m unittest discover -s tests -p 'test_v703_monthly_release.py' -v
          python -m unittest discover -s tests -p 'test_v703_research_charts.py' -v
          python -m unittest discover -s tests -p 'test_macro_safety_monthly.py' -v
          python -m unittest discover -s tests -p 'test_bank_macro_monthly.py' -v
          python scripts/build_daily_v703_site.py --html "系統工程/總經V70/V70-3-27.html" --out build/site
      - name: Require complete 22 of 22 scoring inputs before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('build/site/V70_macro_latest.json').read_text(encoding='utf-8'))
          v=feed['verification']
          assert feed['schema']=='V70.3/family-macro-feed-v3', 'wrong V70 feed schema'
          assert v['ready'] is True, 'V70-3-27 data incomplete; preserve existing published site'
          assert v['independentIndicators']==25
          assert v['transportIndicators']==28 and len(feed['indicators'])==28
          assert v['totalRequired']==26 and v['valid']==26
          assert v['requiredScoringIndicators']==22 and v['requiredScoringIndicatorsValidated']==22
          assert feed['monthlyReleaseCalendar']['schema']=='V70.3/monthly-official-release-calendar-v1'
          assert len(feed['monthlyReleaseCalendar']['items'])==6
          assert feed['sourceSnapshot']['officialReleaseCalendar']
          assert feed.get('sourceSnapshot',{}).get('macro18') and feed.get('sourceSnapshot',{}).get('macro8')
          assert feed['indicators']['m06']['status'] in ('OK','USABLE')
          m06_raw = [feed['indicators'][key] for key in ('m06_rate','m06_inf','m06_rstar','m06_output_gap')]
          assert all(row['status'] in ('OK','USABLE') and row['value'] is not None for row in m06_raw)
          rate, inflation, rstar, output_gap = [float(row['value']) for row in m06_raw]
          actual_gap = (rate - inflation) - rstar
          taylor_gap = 0.5 * (inflation - 2.0) + 0.5 * output_gap
          assert abs(float(feed['indicators']['m06']['value']) - (actual_gap - taylor_gap)) < 0.001
          assert 'm06_taylor_infl' not in feed['indicators']
          # Five public dated forecasts are display-only, not part of 22 macro scoring indicators.
          five=feed['wallStreetFive']
          assert five['schema']=='V70.3/wallstreet-five-forecast-v1'
          assert [(row['firm_id'],row['target'],row['horizon_end_date']) for row in five['forecasts']]==[
              ('goldman',8000,'2026-12-31'),('jpm',8000,'2026-12-31'),
              ('morgan',8000,'2026-12-31'),('bofa',7400,'2026-12-31'),
              ('ubs',8100,'2026-12-31')
          ]
          assert feed['sourceSnapshot']['wallstreet5']
          content=Path('build/site/index.html').read_text(encoding='utf-8')
          assert content.count('公開數字／自寫摘要／來源連結；全文未授權')==5
          assert '待總經 Task 抓取' not in content
          print('V703_WALLSTREET5_PUBLICATION_GATE_PASS',len(five['forecasts']))
          for key in ('m03_qqq','m03_spy','m03_vt'):
              row=feed['indicators'][key]
              assert row['status'] in ('OK','USABLE') and row['value'] is not None
              assert 'forward' in row['method'].lower() or 'fy1' in row['method'].lower()
              assert 'ttm' not in row['method'].lower()
          print('V70_3_27_QA_PASS',feed['asOf'])
          PY
      - name: Publish matching JSON beside official GitHub HTML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.macro18_state import atomic_write
          source=Path('build/site/V70_macro_latest.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          target=Path('系統工程/總經V70/V70_macro_latest.json')
          atomic_write(target, source.read_bytes())
          assert json.loads(target.read_text(encoding='utf-8'))==data
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add "系統工程/總經V70/V70_macro_latest.json"
            if ! git diff --cached --quiet; then
              git commit -m "data(V70-3-27): publish verified 28-indicator feed"
            fi
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "GitHub colocated feed publish failed" >&2; exit 1; fi
            sleep "$((attempt * 2))"
          done
      - name: Upload QA package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v70-3-27-qa-${{ github.run_id }}
          path: build/site/
          if-no-files-found: warn
      - name: Check deployment configuration
        env:
          LW_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          LW_USER: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          LW_PASS: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
        run: |
          test -n "$LW_HOST" && test -n "$LW_USER" && test -n "$LW_PASS" && test -n "$LW_DIR" || {
            echo "Hostinger SFTP configuration unavailable; build artifact retained"; exit 1;
          }
          case "$LW_DIR" in
            public_html|*/public_html|*/public_html/) ;;
            *) echo "::error::Site directory must end in public_html"; exit 1 ;;
          esac
      - name: Deploy validated V70-3-27 HTML and JSON via Hostinger SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          source: build/site/V70_macro_latest.json,build/site/index.html,build/site/v70-research-charts/*
          target: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          strip_components: 2
          overwrite: true
          timeout: 90s
          command_timeout: 90s
      - name: Verify Hostinger homepage and live JSON
        env:
          SITE_BASE_URL: ${{ vars.V703_SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          base=(os.environ.get("SITE_BASE_URL") or "https://www.happihelp.com").rstrip("/")
          expected=json.loads(Path("build/site/V70_macro_latest.json").read_text())
          for attempt in range(4):
              try:
                  stamp=expected["asOf"].replace(":","").replace("+","")
                  with urllib.request.urlopen(base+"/V70_macro_latest.json?v="+stamp,timeout=20) as response:
                      live=json.load(response)
                  with urllib.request.urlopen(base+"/?v="+stamp,timeout=20) as response:
                      page=response.read().decode("utf-8")
                  assert live["schema"]==expected["schema"]
                  assert live["asOf"]==expected["asOf"]
                  assert live["verification"]["ready"] is True
                  assert live["verification"]["independentIndicators"]==25
                  assert live["verification"]["requiredScoringIndicatorsValidated"]==22
                  assert len(live["indicators"])==28
                  assert "V70_macro_latest.json" in page
                  assert "V70-3-27" in page
                  assert live['wallStreetFive']['forecasts']==expected['wallStreetFive']['forecasts']
                  assert live['sourceSnapshot']['wallstreet5']==expected['sourceSnapshot']['wallstreet5']
                  assert page.count('公開數字／自寫摘要／來源連結；全文未授權')==5
                  chart_names=('goldman.png','jpm.png','morgan_stanley.png','bofa.png','ubs.png','macro_slope_candidate.png','overview_7lines.png')
                  assert page.count('id="v703-research-charts"')==1
                  for name in chart_names:
                      page_asset='v70-research-charts/'+name
                      assert page_asset in page, 'chart image missing from homepage: '+name
                      with urllib.request.urlopen(base+'/'+page_asset+'?v='+stamp,timeout=20) as response:
                          assert response.status==200
                          assert response.read(8)==b'\x89PNG\r\n\x1a\n', 'invalid chart PNG: '+name
                  print('HOSTINGER_RESEARCH_CHARTS_LIVE_PASS',len(chart_names))
                  assert all(('>'+format(x,',')+'<') in page for x in (8000,7400,8100))
                  print('HOSTINGER_WALLSTREET5_LIVE_PASS',len(live['wallStreetFive']['forecasts']))
                  print("HOSTINGER_LIVE_PASS",base,expected["asOf"])
                  break
              except Exception as exc:
                  if attempt==3: raise SystemExit("HOSTINGER_LIVE_VERIFY_FAILED: "+repr(exc))
                  time.sleep(12)
          PY

      - name: Record deployment receipt only after verified live HTML and JSON
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          data=json.loads(Path('build/site/V70_macro_latest.json').read_text(encoding='utf8'))
          receipt={'schema':'V70.3/verified-deployment-receipt-v1',
                   'status':'LIVE_VERIFIED',
                   'asOf':data['asOf'],
                   'verifiedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'githubRunId':os.environ['GITHUB_RUN_ID'],
                   'githubSha':os.environ['GITHUB_SHA']}
          Path('build/site/v703_deployment_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('LIVE_RECEIPT_PREPARED',receipt['asOf'],receipt['githubRunId'])
          PY
      - name: Upload verified receipt after successful online readback
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          source: build/site/v703_deployment_receipt.json
          target: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          strip_components: 2
          overwrite: true
          timeout: 90s
          command_timeout: 90s
      - name: Verify live deployment receipt matches the verified feed
        env:
          SITE_BASE_URL: ${{ vars.V703_SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path('build/site/v703_deployment_receipt.json').read_text())
          base=(os.environ.get('SITE_BASE_URL') or 'https://www.happihelp.com').rstrip('/')
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(base+'/v703_deployment_receipt.json?v='+str(time.time_ns()),timeout=20) as response:
                      live=json.load(response)
                  assert live==expected, 'receipt not matching current deployment'
                  print('V703_DEPLOYMENT_RECEIPT_PASS',live['verifiedAtUtc'])
                  break
              except Exception as e:
                  if attempt==3: raise SystemExit('V703_DEPLOYMENT_RECEIPT_FAILED: '+repr(e))
                  time.sleep(10)
          PY
      - name: Install Chromium for verified V70 score capture
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium --with-deps
      - name: Capture daily Macro Safety score after full live verification
        env:
          SITE_BASE_URL: ${{ vars.V703_SITE_BASE_URL }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/capture_v703_daily_snapshot.py \
            --feed build/site/V70_macro_latest.json \
            --site-url "${SITE_BASE_URL:-https://www.happihelp.com}" \
            --archive data/macro_safety_daily.csv \
            --source-commit "$SOURCE_COMMIT"
      - name: Build monthly Macro Safety series from real observations
        run: |
          MONTH_ARGS=$(python - <<'PY'
          import csv
          from pathlib import Path
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Taipei')).date()
          cutoff=date(today.year, today.month, 5)
          if today < cutoff:
              print('WAIT')
              raise SystemExit(0)
          with open('data/macro_safety_daily.csv', newline='', encoding='utf-8-sig') as f:
              valid=[r for r in csv.DictReader(f)
                     if r.get('score_status','').upper() in ('VALID','FORMAL_VALID')
                     and date.fromisoformat(r['observation_date']) <= today
                     and r['observation_date'][:7] == cutoff.strftime('%Y-%m')]
          existing=Path('data/macro_safety_monthly.csv')
          has_month=False
          if existing.exists():
              with existing.open(newline='',encoding='utf-8-sig') as f:
                  has_month=any(row.get('snapshot_month') == cutoff.strftime('%Y-%m')
                                for row in csv.DictReader(f))
          if any(date.fromisoformat(r['observation_date']) <= cutoff for r in valid):
              print('BUILD')
          elif valid and not has_month:
              print('--retry-month '+cutoff.strftime('%Y-%m'))
          elif has_month:
              print('BUILD')
          else:
              print('WAIT')
          PY
          )
          if [ "$MONTH_ARGS" = "WAIT" ]; then
            echo "No eligible verified score for this month yet; no monthly row added."
            exit 0
          fi
          if [ "$MONTH_ARGS" = "BUILD" ]; then
            MONTH_ARGS_ARRAY=()
          else
            read -r -a MONTH_ARGS_ARRAY <<< "$MONTH_ARGS"
          fi
          python scripts/monthly_research/macro_safety_monthly.py \
            --daily data/macro_safety_daily.csv \
            --output data/macro_safety_monthly.csv \
            --cutoff-day 5 \
            --as-of "$(TZ=Asia/Taipei date +%F)" \
            --run-timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${MONTH_ARGS_ARRAY[@]}"
      - name: Build monthly bank forecast and Macro Safety comparison CSV
        run: |
          python scripts/monthly_research/build_bank_macro_monthly.py \
            --bank-register experiments/macro-safety-monthly-research/bank_forecast_register_research.csv \
            --macro-monthly data/macro_safety_monthly.csv \
            --output experiments/macro-safety-monthly-research/bank_macro_monthly_snapshot.csv
      - name: Publish immutable daily Macro Safety archive row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro_safety_daily.csv
          if [ -s data/macro_safety_monthly.csv ]; then git add data/macro_safety_monthly.csv; fi
          git add experiments/macro-safety-monthly-research/bank_macro_monthly_snapshot.csv
          if git diff --cached --quiet; then
            echo "Daily Macro Safety and five-institution monthly research archives already current"
            exit 0
          fi
          git commit -m "data(V70): archive Macro Safety and institution monthly snapshots"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "Daily Macro Safety archive publish failed" >&2; exit 1; fi
            sleep "$((attempt * 2))"
          done

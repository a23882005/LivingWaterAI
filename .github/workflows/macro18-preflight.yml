# 最後修改：2026/10/16（台灣時間；精確時間未核實）｜版本：D009-v1｜檔案：macro18-preflight.yml
name: LivingWaterAI V70.3 09h Preflight 18 Macro
on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Taipei
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macro18-preflight.yml'
      - '系統工程/總經V70/總經爬蟲18項.py'
      - '系統工程/總經V70/macro_source_config.json'
      - 'scripts/macro18_state.py'
      - 'scripts/macro18_alert.py'
      - 'scripts/probe_m06_fedwatch_free.py'
permissions:
  contents: write
concurrency:
  group: livingwater-macro18-preflight
  cancel-in-progress: false
jobs:
  preflight18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and static QA
        run: |
          python -m pip install requests pandas yfinance pypdf
          python -m json.tool "系統工程/總經V70/macro_source_config.json" > /dev/null
          python -m py_compile "系統工程/總經V70/總經爬蟲18項.py" scripts/probe_m06_fedwatch_free.py scripts/macro18_state.py scripts/macro18_alert.py
          python "系統工程/總經V70/總經爬蟲18項.py" --self-test
      - name: Mount dedicated persistent state branch and restore missing cache
        run: |
          git fetch origin automation-state
          git worktree add --detach /tmp/livingwater-macro-state origin/automation-state
          if ! python scripts/macro18_state.py verify --state-dir /tmp/livingwater-macro-state --input data/18_macro_verification.json; then
            echo "Primary cache missing or invalid; attempt verified historical recovery"
            python scripts/macro18_state.py recover --state-dir /tmp/livingwater-macro-state --output data/18_macro_verification.json || true
          fi
      - name: Fetch independent 18 macro indicators, preserve previous verified data
        env:
          CME_DATA_AUTOMATION_AUTHORIZED: ${{ vars.CME_DATA_AUTOMATION_AUTHORIZED }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p build/macro18
          args=(--out build/macro18)
          test ! -f data/18_macro_verification.json || args+=(--cache data/18_macro_verification.json)
          # Run without unvetted overrides; existing verified cache stays marked STALE.
          python "系統工程/總經V70/總經爬蟲18項.py" "${args[@]}"
      - name: Contract QA and copy for 10 AM Task
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('build/macro18/18_macro_verification.json')
          d=json.loads(p.read_text(encoding='utf8'))
          items=d['items']
          assert len(items)==19 and 's03' in items and all(k not in items for k in ('s05','m06','m03_qqq','m03_spy','m03_vt'))
          assert len(set(items)-{'s03'})==18
          assert d['independent_indicators']['total']==18
          history=d.get('lei_history',[])
          assert len(history)==3, 'LEI three-month history missing'
          assert history[-1]['observation_date']==items['m16']['observation_date']
          assert abs(history[-1]['value']-items['m16']['value'])<0.000001
          pathlib.Path('data').mkdir(exist_ok=True)
          from scripts.macro18_state import atomic_write, validate
          validate(d)
          atomic_write('data/18_macro_verification.json',
              (json.dumps(d,ensure_ascii=False,indent=2)+'\n').encode('utf8'))
          print('Preflight 18 contract OK; counts=',d.get('summary'))
          PY
      - name: Evaluate consecutive failures and persist alert state
        run: |
          python scripts/macro18_alert.py --report build/macro18/18_macro_verification.json --state /tmp/livingwater-macro-state/macro_alert_state.json --alert-file build/macro18/alerts.json
      - name: Rotate three verified snapshots on automation-state
        run: |
          python scripts/macro18_state.py snapshot --input build/macro18/18_macro_verification.json --state-dir /tmp/livingwater-macro-state
          git -C /tmp/livingwater-macro-state config user.name "github-actions[bot]"
          git -C /tmp/livingwater-macro-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/livingwater-macro-state add -A backups/ macro_alert_state.json
          if ! git -C /tmp/livingwater-macro-state diff --cached --quiet; then
            git -C /tmp/livingwater-macro-state commit -m "data(D009): rotate validated macro18 backups"
            for attempt in 1 2 3; do
              if git -C /tmp/livingwater-macro-state push origin HEAD:automation-state; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "State backup push failed" >&2; exit 1; fi
              git -C /tmp/livingwater-macro-state fetch origin automation-state
              git -C /tmp/livingwater-macro-state rebase origin/automation-state
              sleep "$((attempt * 2))"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro18-09h-${{ github.run_id }}
          path: build/macro18/
          if-no-files-found: warn
      - name: Publish D009 alert flag for notification job
        if: always()
        run: |
          if [ -f build/macro18/alerts.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/macro18/alerts.json').read_text())
          if d.get('alerts'):
              Path('build/macro18/needs_alert').write_text('1')
          PY
          fi
      - name: Publish 09h source for ChatGPT 10h Task
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/18_macro_verification.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro18): 09h observed 18 indicator preflight"
            git pull --rebase origin main
            git push origin HEAD:main
          fi


# Re-run collector on 2026-10-15 for end-to-end verification

# Manual rerun request 2026-10-15, preserve all workflow logic

# manual-run-request-20261015-verify18


  notify-on-critical:
    needs: preflight18
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macro18-09h-${{ github.run_id }}
          path: macro-alert
      - name: Trigger native GitHub workflow failure notification only when alert-worthy
        run: |
          if [ -f macro-alert/needs_alert ]; then
            echo "::error::D009 first/third/persistent/core macro source failure. See alerts.json."
            cat macro-alert/alerts.json
            exit 1
          fi
          echo "No new D009 alert"

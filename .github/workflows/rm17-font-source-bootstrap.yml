name: RM17 temporary official CJK font bootstrap
on:
  push:
    branches:
      - codex/rm17-font-source-20261016
    paths:
      - .github/workflows/rm17-font-source-bootstrap.yml
permissions:
  contents: read
jobs:
  package-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Noto CJK Traditional Chinese fonts
        run: |
          set -euo pipefail
          mkdir -p rm17-fonts
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf \
            --output rm17-fonts/NotoSansCJKtc-Regular.otf
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Bold.otf \
            --output rm17-fonts/NotoSansCJKtc-Bold.otf
          sha256sum rm17-fonts/*
      - name: Upload temporary font bundle
        uses: actions/upload-artifact@v4
        with:
          name: rm17-noto-cjk-tc-fonts
          path: rm17-fonts/
          retention-days: 1

# 2026/10/22 W7-A13：以新版八項補充與核心資料重驗 main 真實 feed；共用政策 Chromium 案例同步保留。
# 最後修改日期時間：2026/10/20 09:37（台灣時間）｜檔案名稱：v703-frontend-regression.yml｜版本：V70-3-27 瀏覽器回歸測試（季度共識表固定前兩欄）
# 2026/10/20 本輪回歸：驗證最新 main feed 建置與 Hostinger 上季度完整表格的固定日期／SP500實際報酬兩欄。
name: LivingWaterAI V70-3-27 Browser Regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v703-frontend-regression.yml'
      - 'scripts/build_daily_v703_site.py'
      - 'tests/policy_case_matrix.py'
      - 'tests/test_v703_policy*.py'
      - 'tests/v703_browser_fixture.py'
      - 'scripts/capture_v703_daily_snapshot.py'
      - 'scripts/validate_v703_publication.py'
      - '系統工程/總經V70/V70-3-27.html'
      - 'tests/test_v703_monthly_release.py'
      - 'tests/test_v703_failure_mail.py'
      - 'scripts/send_action_gmail_report.py'
      - 'data/v703_official_monthly_release_calendar.json'
permissions:
  contents: read
jobs:
  v703-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete feed
        run: |
          python -m py_compile scripts/build_daily_v703_site.py scripts/send_action_gmail_report.py
          python -m unittest discover -s tests -p 'test_v703_monthly_release.py' -v
          python -m unittest discover -s tests -p 'test_v703_failure_mail.py' -v
          python scripts/build_daily_v703_site.py --html '系統工程/總經V70/V70-3-27.html' --out build/site
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/site/V70_macro_latest.json').read_text())
          assert p['verification']['ready'] is True
          for k in ('m03_qqq','m03_spy','m03_vt'):
              assert p['indicators'][k]['lastVerifiedAt'], k
              assert p['indicators'][k]['sourceEvidence'], k
          firms=p.get('wallStreetFive',{}).get('forecasts',[])
          assert [(x['firm_id'],x['target']) for x in firms] == [
              ('goldman',8000),('jpm',8000),('morgan',8000),('bofa',7400),('ubs',8100)
          ]
          built=Path('build/site/index.html').read_text(encoding='utf-8')
          assert '資料查核日：等待建置' not in built
          assert built.count('公開數字／自寫摘要／來源連結；全文未授權')==5
          print('WALLSTREET5_FEED_AND_HTML_PASS',len(firms),flush=True)
          print('FEED_PROVENANCE_PASS',p['asOf'],flush=True)
          PY
      - name: Install real browser
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium --with-deps
      - name: Browser test complete client calculation; never deploy
        run: |
          python -u - <<'PY'
          import contextlib,json,subprocess,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path('build/site/V70_macro_latest.json').read_text(encoding='utf-8'))['indicators']
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1','--directory','build/site'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              for n in range(30):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8765/V70_macro_latest.json',timeout=2) as u: assert u.status==200
                      break
                  except Exception:
                      time.sleep(.2)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  page=browser.new_page(viewport={'width':420,'height':850},locale='zh-TW',timezone_id='Asia/Taipei')
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.route('**/cdn.tailwindcss.com/**',lambda route:route.abort())
                  page.route('**/fonts.googleapis.com/**',lambda route:route.abort())
                  page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded',timeout=30000)
                  try:page.wait_for_function("window.v703FeedVerified===true",timeout=18000)
                  except Exception as e: print('VERIFICATION_WAIT_FAILED',repr(e),flush=True)
                  snapshot=page.evaluate("""() => ({
                      verified:window.v703FeedVerified,
                      complete:window.v703DataComplete,
                      dates:window.v703VerifiedDataDates,
                      creditBlocked:window.v703CreditGateBlocked,
                      issues:window.v703DateIssues,
                      status:document.querySelector('#family-data-status')?.textContent,
                      values:Object.fromEntries(['m03_qqq','m03_spy','m03_vt','m10','m06','s05'].map(x=>[x,document.getElementById('in_'+x)?.value])),
                      scores:Object.fromEntries(['m03_qqq','m03_spy','m10','m06','s05'].map(x=>[x,document.getElementById('sc_'+x)?.textContent])),
                      finalStock:document.querySelector('#final-stock')?.textContent,
                      finalBond:document.querySelector('#final-bond')?.textContent,
                      canPublish:window.v703CanPublishFormalAllocation?.(),
                      wallstreet:[...document.querySelectorAll('#v703-wallstreet-rows tr')].map(tr=>({
                          firm:tr.cells[0]?.textContent,
                          target:tr.cells[3]?.textContent,
                          source:tr.cells[5]?.querySelector('a')?.href
                      })),
                      v703Latest:!!window.v703Latest
                  })""")
                  print('V703_BROWSER_SNAPSHOT',json.dumps(snapshot,ensure_ascii=False),flush=True)
                  print('V703_BROWSER_ERRORS',json.dumps(errors,ensure_ascii=False),flush=True)
                  assert snapshot['verified'] is True,('Browser failed to consume verified feed',snapshot,errors)
                  assert snapshot['canPublish'] is True and snapshot['dates'] is True, snapshot
                  for key,value in snapshot['values'].items():
                      assert abs(float(value)-float(expected[key]['value']))<1e-5,(key,value,expected[key]['value'])
                  assert len(set(snapshot['scores'].values()))>2,'All score sliders are stuck at one value'
                  assert snapshot['finalStock'] and '計算中' not in snapshot['finalStock']
                  assert snapshot['finalBond'] and '計算中' not in snapshot['finalBond']
                  assert [x['target'].strip() for x in snapshot['wallstreet']] == [
                      '8,000','8,000','8,000','7,400','8,100'
                  ],('Missing/inaccurate five-bank row values',snapshot['wallstreet'])
                  assert all(x['source'].startswith('https://') for x in snapshot['wallstreet'])
                  print('WALLSTREET5_BROWSER_E2E_PASS',flush=True)
                  assert not errors,('JS runtime errors',errors)
                  print('V703_BROWSER_E2E_PASS',flush=True)
                  browser.close()
          finally:
              server.terminate()
              with contextlib.suppress(Exception):server.wait(timeout=3)
          PY
  w7-contract-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium --with-deps
      - name: W7 policy and formal operation browser acceptance
        run: |
          mkdir -p build/w7-browser
          set -o pipefail
          python -u - <<'PYTEST' 2>&1 | tee build/w7-browser/cases.log
          import sys,json,copy,datetime
          sys.path.insert(0,'tests')
          from playwright.sync_api import sync_playwright
          from v703_browser_fixture import feed,HTML,NOW,b
          from policy_case_matrix import cases
          results=[]
          with sync_playwright() as driver:
              browser=driver.chromium.launch(headless=True)
              def open_feed(data):
                  context=browser.new_context(locale='zh-TW',timezone_id='Asia/Taipei')
                  page=context.new_page()
                  page.clock.install(time=NOW)
                  page.on('dialog',lambda dialog:dialog.accept())
                  def route(r):
                      path=r.request.url
                      if path=='http://w7.test/':r.fulfill(content_type='text/html',body=HTML.read_text())
                      elif path=='http://w7.test/V70_macro_latest.json':r.fulfill(json=data)
                      else:r.abort()
                  page.route('**/*',route)
                  page.goto('http://w7.test/',wait_until='domcontentloaded')
                  page.wait_for_function("document.querySelector('#family-data-status') && !document.querySelector('#family-data-status').textContent.includes('正在讀取')")
                  return context,page
              def check(name,condition,page):
                  if not condition:
                      print('FAILED_STATE',page.evaluate("({verified:window.v703FeedVerified,issues:window.v703DateIssues,status:document.querySelector('#family-data-status')?.textContent})"))
                      raise AssertionError(name)
                  results.append(name);print('BROWSER_CASE',name,'PASS',flush=True)
              context,page=open_feed(feed())
              check('formal_valid',page.evaluate('window.v703CanPublishFormalAllocation()===true'),page)
              from scripts.capture_v703_daily_snapshot import build_record,append_idempotent
              from pathlib import Path
              snapshot=page.evaluate("({verified:window.v703FeedVerified,canPublish:window.v703CanPublishFormalAllocation(),latest:window.v703Latest,sourceBatch:window.v703SourceBatch})")
              record=build_record(feed(),snapshot,'2026-10-22T03:01:00Z','synthetic-test-commit','synthetic-test-hash')
              archive=Path('build/w7-browser/synthetic_daily.csv')
              check('browser_score_archive',append_idempotent(archive,record) and not append_idempotent(archive,record),page)

              for name,row,now,expected in cases():
                  actual=page.evaluate('x=>v703PolicyIssues(x.row,x.now).length===0',{'row':b._normalize(row,'m06_rate'),'now':now.timestamp()*1000})
                  check('shared_'+name,actual==expected,page)
              for key in ['in_m06_rate','v703-date-m06_rate','v703-source-m06_rate']:
                  original=page.locator('#'+key).input_value()
                  page.locator('#'+key).evaluate("(e,v)=>{e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}",{'in_m06_rate':'4.2','v703-date-m06_rate':'2026-07-29','v703-source-m06_rate':'https://example.com'}[key])
                  check('manual_'+key,page.evaluate('window.v703CanPublishFormalAllocation()===false'),page)
                  context.close();context,page=open_feed(feed())
              page.clock.set_fixed_time(datetime.datetime(2026,10,23,4,tzinfo=datetime.timezone.utc))
              check('open_page_policy_expired',page.evaluate('window.v703CanPublishFormalAllocation()===false'),page)
              context.close();context,page=open_feed(feed())
              page.evaluate("window.v703SourceBatch.asOf=new Date(Date.now()-26*3600000).toISOString()")
              check('open_page_snapshot_expired',page.evaluate('window.v703CanPublishFormalAllocation()===false'),page)
              context.close();context,page=open_feed(feed())
              page.evaluate('window.v703StartDemo()')
              check('research_mode',page.evaluate('window.v703DemoMode===true && window.v703CanPublishFormalAllocation()===false'),page)
              context.close()
              for key in b.M06_COMPONENTS:
                  for fault in ['stale','candidate_missing']:
                      data=feed()
                      if fault=='stale':data['indicators'][key]['dataDate']='2020-01-01'
                      else:data['indicators'][key]['candidateChecks']=[]
                      context,page=open_feed(data)
                      check(key+'_'+fault,page.evaluate('window.v703CanPublishFormalAllocation()===false'),page)
                      context.close()
              browser.close()
          from pathlib import Path
          Path('build/w7-browser/result.json').write_text(json.dumps({'fixture':'SYNTHETIC ONLY','cases':results,'count':len(results),'status':'PASS'},indent=2))
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w7-contract-browser-${{ github.run_id }}
          path: build/w7-browser/

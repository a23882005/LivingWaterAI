name: Family W8 verified candidate research
on:
  push:
    branches: [w8-family-candidate-research-20261026]
    paths: ['系統工程/Family/W8/official_research.py','系統工程/Family/W8/probes/live_research_readonly.py','.github/workflows/family-w8-candidate-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
      FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
      FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compile W8 research and its real evidence probe
        run: python -m py_compile 系統工程/Family/W8/official_research.py 系統工程/Family/W8/probes/live_research_readonly.py
      - name: Read all official four DBs and fetch actual dated market evidence
        run: python 系統工程/Family/W8/probes/live_research_readonly.py

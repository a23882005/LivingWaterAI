name: Family B06 resource IO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-b06-resource-io.yml'
      - '系統工程/Family/W7/資料存取管理.py'
      - '系統工程/Family/W7/drive_resource_backend.py'
      - '系統工程/Family/W7/tests/test_resource_io.py'
      - '系統工程/Family/W7/tests/test_drive_resource_backend.py'
      - '系統工程/Family/W7/probes/b06_drive_integration.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-b04-temp-drive-writer
  cancel-in-progress: false
jobs:
  io:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest 系統工程/Family/W7/tests/test_resource_io.py 系統工程/Family/W7/tests/test_drive_resource_backend.py 系統工程/Family/W7/tests/test_resource_headers.py 系統工程/Family/W7/tests/test_source_resources.py -q --junitxml=build/family-b06/results.xml
      - name: Drive same-ID writes, process exit, concurrent merge and exact restore
        env:
          FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
          FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
          FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
        run: python 系統工程/Family/W7/probes/b06_drive_integration.py verify
      - name: Recover TEMP baseline after any failure
        if: always()
        env:
          FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
          FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
          FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
        run: python 系統工程/Family/W7/probes/b06_drive_integration.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-b06-io-${{ github.run_id }}
          path: |
            build/family-b06/*.json
            build/family-b06/results.xml

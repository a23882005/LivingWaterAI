name: Family W7 synthetic capability probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-w7-capability-probe.yml'
      - '系統工程/Family/W7/probes/**'
      - '系統工程/Family/W7/tests/test_session_queue_probe.py'
      - '系統工程/Family/W7/tests/test_family_entry_probe.py'
      - '系統工程/Family/W7/tests/test_work12_source_contract.py'
      - '系統工程/Family/W7/vendor/work12/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest 系統工程/Family/W7/tests/test_session_queue_probe.py 系統工程/Family/W7/tests/test_family_entry_probe.py 系統工程/Family/W7/tests/test_work12_source_contract.py -q --junitxml=synthetic-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-w7-synthetic-capability-${{ github.run_id }}
          path: synthetic-results.xml
      - run: echo 'SYNTHETIC ONLY; no Drive credentials, no formal DB, no deployment. Production HOLD; trading NONE.' >> "$GITHUB_STEP_SUMMARY"
  existing-service-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only the existing Hostinger runtime capabilities
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          command_timeout: 60s
          script: |
            if command -v php >/dev/null 2>&1; then
              php -r 'echo "FAMILY_B04_CAPABILITIES ".json_encode(["php"=>PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION,"pdo_sqlite"=>extension_loaded("pdo_sqlite"),"curl"=>extension_loaded("curl"),"openssl"=>extension_loaded("openssl")]).PHP_EOL;'
            else
              echo 'FAMILY_B04_CAPABILITIES {"php":false}'
            fi
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import json,sys,sqlite3; print("FAMILY_B04_PYTHON "+json.dumps({"python":"%d.%d"%sys.version_info[:2],"sqlite":sqlite3.sqlite_version}))'
            else
              echo 'FAMILY_B04_PYTHON {"python":false}'
            fi
      - name: Verify designated Family Drive connection with TEMP read only
        env:
          FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
          FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
          FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
        run: python 系統工程/Family/W7/probes/actions_drive_read_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-b04-connection-${{ github.run_id }}
          path: build/family-b04/drive-read.json
          if-no-files-found: warn
  hosted-synthetic-entry:
    needs: existing-service-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
      LW_RUN: ${{ github.run_id }}
      LW_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build temporary synthetic entry with ephemeral test credentials
        id: build
        run: |
          case "${LW_DIR%/}" in
            public_html|*/public_html) ;;
            *) echo 'Invalid existing website directory'; exit 1 ;;
          esac
          python 系統工程/Family/W7/probes/hosted_entry_client.py build
      - name: Upload only the unique test entry through existing deployment credentials
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          source: build/family-b04-hosted/public/index.php
          target: ${{ vars.HOSTINGER_SITE_DIRECTORY }}/family-w7-probe-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 3
          timeout: 90s
          command_timeout: 90s
      - name: Check remote PHP syntax
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,LW_RUN,LW_ATTEMPT
          script: php -l "${LW_DIR%/}/family-w7-probe-$LW_RUN-$LW_ATTEMPT/index.php" >/dev/null
      - name: Verify real HTTPS login resume isolation queue and retry
        env:
          SITE_BASE_URL: ${{ vars.V703_SITE_BASE_URL }}
        run: python 系統工程/Family/W7/probes/hosted_entry_client.py verify
      - name: Remove only this run temporary endpoint and synthetic state
        if: always() && steps.build.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,LW_RUN,LW_ATTEMPT
          script: |
            set -eu
            LW_DIR="${LW_DIR%/}"
            case "$LW_DIR" in public_html|*/public_html) ;; *) exit 1 ;; esac
            case "$LW_RUN-$LW_ATTEMPT" in *[!0-9-]*) exit 1 ;; esac
            probe="$LW_DIR/family-w7-probe-$LW_RUN-$LW_ATTEMPT"
            state="$(dirname "$LW_DIR")/.family-w7-probe-$LW_RUN-$LW_ATTEMPT.sqlite"
            rm -f -- "$probe/index.php" "$state" "$state-journal" "$state-wal" "$state-shm"
            if [ -d "$probe" ]; then rmdir -- "$probe"; fi
            test ! -e "$probe/index.php"
            test ! -e "$state"
            echo 'FAMILY_B04_TEMP_CLEANUP_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-b04-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/family-b04-hosted/hosted-proof.json
          if-no-files-found: warn

name: Family 03 public adjusted prices
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "系統工程/Family/W8/family03_prices.py"
      - ".github/workflows/family03-prices.yml"
  push:
    branches: [family03-recommendation]
    paths:
      - '系統工程/Family/W8/family03_prices.py'
      - '.github/workflows/family03-prices.yml'
permissions:
  contents: read
jobs:
  prices:
    if: github.event_name != 'push' || github.ref_name == 'family03-recommendation'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yfinance>=0.2.66,<2'
      - run: python '系統工程/Family/W8/family03_prices.py' --output family03-prices.zip
      - uses: actions/upload-artifact@v4
        with:
          name: family03-public-prices
          path: family03-prices.zip

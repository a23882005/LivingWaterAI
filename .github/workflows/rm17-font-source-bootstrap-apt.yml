name: RM17 temporary Ubuntu Noto CJK TTC bootstrap
on:
  push:
    branches:
      - codex/rm17-font-source-20261016
    paths:
      - .github/workflows/rm17-font-source-bootstrap-apt.yml
permissions:
  contents: read
jobs:
  package-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu Noto CJK package
        run: |
          set -euo pipefail
          mkdir -p rm17-fonts package
          cd package
          sudo apt-get update -qq
          apt-get download fonts-noto-cjk
          dpkg-deb -x fonts-noto-cjk_*.deb extracted
          cp extracted/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ../rm17-fonts/
          cp extracted/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ../rm17-fonts/
          cd ../rm17-fonts
          sha256sum *
      - name: Upload temporary font bundle
        uses: actions/upload-artifact@v4
        with:
          name: rm17-noto-cjk-ubuntu-ttc
          path: rm17-fonts/
          retention-days: 1

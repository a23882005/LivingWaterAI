# Official NY Fed real-time HLW collector + V70-3-27 full QA. No Hostinger deploy.
name: LivingWaterAI HLW Real-Time rstar Verified Collector
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hlw-realtime-rstar-check.yml'
      - 'scripts/update_hlw_rstar.py'
permissions:
  contents: write
concurrency:
  group: lw-hlw-official-rstar-collector
  cancel-in-progress: false
jobs:
  verify-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Parse official HLW real-time Excel and stage supplement (not published yet)
        run: |
          python -m py_compile scripts/update_hlw_rstar.py scripts/build_daily_v703_site.py
          python scripts/update_hlw_rstar.py
      - name: V70-3-27 complete feed QA before any publish
        run: |
          python scripts/build_daily_v703_site.py --html '系統工程/總經V70/V70-3-27.html' --out build/site
          python - <<'PY'
          import json
          from pathlib import Path
          extra=json.loads(Path('data/8_macro_supplement_verified.json').read_text(encoding='utf-8'))
          feed=json.loads(Path('build/site/V70_macro_latest.json').read_text(encoding='utf-8'))
          r=extra['items']['m06_rstar']
          v=feed['verification']
          assert r['status']=='OK' and r['value'] is not None
          assert r['observation_date'][-5:]=='06-30' or r['observation_date'][-5:] in ('03-31','09-30','12-31')
          assert 'REAL-TIME' in r['method']
          assert len(r['candidate_checks'])==4 and r['candidate_checks'][1]['status']=='FOUND'
          assert feed['schema']=='V70.3/family-macro-feed-v3'
          assert v['ready'] is True, v
          assert v['valid']==26 and v['requiredScoringIndicatorsValidated']==22, v
          assert v['independentIndicators']==25 and len(feed['indicators'])==28, v
          print('HLW_OFFICIAL_AND_V70_3_27_FULL_QA_PASS',r['value'],r['observation_date'],v,flush=True)
          PY
      - name: Publish only verified 8-supplement JSON, with concurrent commit isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -- data/8_macro_supplement_verified.json
            if ! git diff --cached --quiet; then
              git commit -m 'data(hlw): verified official real-time rstar quarter vintage'
            else
              echo 'No changes to publish'
              break
            fi
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo 'HLW verified data push failed' >&2; exit 1; fi
            sleep "$((attempt * 2))"
          done
      - name: Read-back submitted data on main
        run: |
          git fetch origin main
          git show origin/main:data/8_macro_supplement_verified.json | python -c "import json,sys; r=json.load(sys.stdin)['items']['m06_rstar']; assert r['status']=='OK' and r['value'] is not None; print('HLW_GITHUB_READBACK_PASS',r['value'])"
      - name: Retain full V70 QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlw-v703-qa-${{ github.run_id }}
          path: build/site/
          if-no-files-found: warn

name: Family B04 TEMP Drive recovery probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-b04-drive-roundtrip.yml'
      - '系統工程/Family/W7/probes/actions_drive_write_probe.py'
      - '系統工程/Family/W7/tests/test_actions_drive_write_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-b04-temp-drive-writer
  cancel-in-progress: false
jobs:
  temp-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
      FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
      FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest 系統工程/Family/W7/tests/test_actions_drive_write_probe.py -q
      - name: Back up fixed TEMP DB, write, read back, interrupt and recover
        run: python 系統工程/Family/W7/probes/actions_drive_write_probe.py verify
      - name: Recover pending TEMP transaction even after probe failure
        if: always()
        run: python 系統工程/Family/W7/probes/actions_drive_write_probe.py recover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-b04-drive-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/family-b04/drive-*.json

name: Family W8 real DB schema mutation regression
on:
  push:
    branches: [w8-four-family-fourteen-handlers-20261026]
    paths:
      - '系統工程/Family/W8/official_mutations.py'
      - '系統工程/Family/W8/probes/verify_live_mutations.py'
      - '.github/workflows/family-w8-live-mutations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-w8-official-db-readonly
  cancel-in-progress: false
jobs:
  actual-schema-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAMILY_DRIVE_CLIENT_ID: ${{ secrets.FAMILY_DRIVE_CLIENT_ID }}
      FAMILY_DRIVE_CLIENT_SECRET: ${{ secrets.FAMILY_DRIVE_CLIENT_SECRET }}
      FAMILY_DRIVE_REFRESH_TOKEN: ${{ secrets.FAMILY_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile 系統工程/Family/W8/official_mutations.py 系統工程/Family/W8/probes/verify_live_mutations.py
      - name: Execute all four actual DB schemas on local in-memory mutation copies
        run: python 系統工程/Family/W8/probes/verify_live_mutations.py
      - if: always()
        run: echo 'Read four official Drive DBs, exercise B06 transactional writers in temp copies, read again; production source DB write count ZERO.' >> "$GITHUB_STEP_SUMMARY"

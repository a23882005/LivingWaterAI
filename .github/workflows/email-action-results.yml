# 最後修改日期時間：2026/10/18 17:10（台灣時間）｜檔案名稱：email-action-results.yml｜版本：Gmail 成功／失敗執行結果通知
name: LivingWaterAI Gmail Action result reports

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - LivingWaterAI 07h IB global market history
      - LivingWaterAI V70.3 09h Preflight 18 Macro
      - LivingWaterAI 11h Verified V70.3 Site Deploy
      - LivingWaterAI 14h30 IB Taiwan market history
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  email-result-report:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report sender
        uses: actions/checkout@v4
      - name: Select the source run artifact
        id: artifact
        env:
          SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          case "$SOURCE_RUN_NAME" in
            "LivingWaterAI 07h IB global market history") name="ib-global-history-$SOURCE_RUN_ID" ;;
            "LivingWaterAI V70.3 09h Preflight 18 Macro") name="macro18-09h-$SOURCE_RUN_ID" ;;
            "LivingWaterAI 11h Verified V70.3 Site Deploy") name="v70-3-27-qa-$SOURCE_RUN_ID" ;;
            "LivingWaterAI 14h30 IB Taiwan market history") name="ib-taiwan-history-$SOURCE_RUN_ID" ;;
            *) echo "::error::Unrecognized source workflow: $SOURCE_RUN_NAME"; exit 1 ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Download actual output artifact when available (failure may have none)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.artifact.outputs.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: run-artifact
      - name: Send results and attached data through Gmail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          SOURCE_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: python scripts/send_action_gmail_report.py --artifact-dir run-artifact

  email-connection-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send a test email through Gmail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          if not password:
              raise RuntimeError("GitHub Actions secret GMAIL_APP_PASSWORD is missing.")
          message = EmailMessage()
          message["From"] = "a23882005@gmail.com"
          message["To"] = "a23882005@gmail.com"
          message["Subject"] = "[LivingWaterAI] Gmail Action 連線測試"
          message.set_content(
              "這是 LivingWaterAI GitHub Actions 的 Gmail 連線測試信。\n"
              "若你收到此信，代表 GitHub Secret 與 Gmail 寄送授權已成功。"
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login("a23882005@gmail.com", password)
              smtp.send_message(message)
          print("GMAIL_TEST_SENT to=a23882005@gmail.com")
          PY

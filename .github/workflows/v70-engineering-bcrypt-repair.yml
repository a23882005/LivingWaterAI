name: V70 engineering bcrypt compatibility repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v70-engineering-bcrypt-repair.yml']
permissions: {}
concurrency:
  group: lw-v703-site-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replace only the verified account hash and require HTTPS readback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          WEB_USER: ${{ secrets.V70_ENGINEERING_USER }}
          WEB_PASSWORD: ${{ secrets.V70_ENGINEERING_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,WEB_USER,WEB_PASSWORD,RUN_ID
          script: |
            set -eu
            python3 - <<'PY'
            import base64, ctypes, ctypes.util, fcntl, http.client, os, re, stat, tempfile, time
            from pathlib import Path
            root = Path(os.environ['LW_DIR']).resolve(strict=True)
            if root.name != 'public_html' or root.parent.name != 'happihelp.com':
                raise SystemExit('ROOT_REVIEW_REQUIRED')
            directory = root.parent / 'v70-engineering-auth'
            verifier = directory / 'engineering.htpasswd'
            config = root / 'v70-engineering' / '.htaccess'
            if any(p.is_symlink() for p in (directory, verifier, config)):
                raise SystemExit('SYMLINK_REVIEW_REQUIRED')
            if not verifier.is_file() or not config.is_file():
                raise SystemExit('AUTH_FILES_REVIEW_REQUIRED')
            info = verifier.stat()
            if info.st_nlink != 1 or info.st_size > 1048576 or info.st_mode & 0o022:
                raise SystemExit('AUTH_FILE_MODE_REVIEW_REQUIRED')
            if 'AuthUserFile ' + str(verifier) not in config.read_text():
                raise SystemExit('AUTH_FILE_BINDING_REVIEW_REQUIRED')
            user, password = os.environb[b'WEB_USER'], os.environb[b'WEB_PASSWORD']
            if not re.fullmatch(rb'[A-Za-z0-9_.@+-]{1,255}', user) or not 1 <= len(password) <= 72:
                raise SystemExit('AUTH_SECRET_FORMAT_REVIEW_REQUIRED')
            old = verifier.read_bytes()
            matches = list(re.finditer(rb'(?m)^' + re.escape(user) + rb':([^\r\n]*)', old))
            if len(matches) != 1:
                raise SystemExit('ACCOUNT_REVIEW_REQUIRED')
            match = matches[0]
            existing = match[1]
            if not re.fullmatch(rb'\$2[aby]\$(10|12)\$[./A-Za-z0-9]{53}', existing):
                raise SystemExit('HASH_FORMAT_REVIEW_REQUIRED')
            lib = ctypes.CDLL(ctypes.util.find_library('crypt'))
            lib.crypt.argtypes = [ctypes.c_char_p, ctypes.c_char_p]
            lib.crypt.restype = ctypes.c_char_p
            lib.crypt_gensalt.argtypes = [ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p, ctypes.c_int]
            lib.crypt_gensalt.restype = ctypes.c_char_p
            if lib.crypt(password, existing) != existing:
                raise SystemExit('CREDENTIAL_MISMATCH')
            login = base64.b64encode(user + b':' + password).decode()
            def get(name, signed=False):
                conn = http.client.HTTPSConnection('www.happihelp.com', timeout=15)
                headers = {'Cache-Control': 'no-cache'}
                if signed:
                    headers['Authorization'] = 'Basic ' + login
                try:
                    conn.request('GET', '/v70-engineering/' + name + '?v=' + str(time.time_ns()), headers=headers)
                    response = conn.getresponse()
                    return response.status, response.getheader('WWW-Authenticate', ''), response.read()
                finally:
                    conn.close()
            def online():
                for name in ('index.html', 'V70_macro_latest.json'):
                    guest, realm, _ = get(name)
                    signed, _, body = get(name, True)
                    if guest != 401 or not realm.lower().startswith('basic ') or signed != 200:
                        return False
                    if body != (root / 'v70-engineering' / name).read_bytes():
                        return False
                    print('PROTECTED_READBACK_PASS', name, flush=True)
                return True
            if existing[4:6] == b'10' and online():
                print('CURRENT_HASH_ALREADY_VERIFIED', flush=True)
                raise SystemExit(0)
            guest, realm, _ = get('index.html')
            if guest != 401 or not realm.lower().startswith('basic '):
                raise SystemExit('GUEST_PROTECTION_REVIEW_REQUIRED')
            random_bytes = os.urandom(16)
            salt = lib.crypt_gensalt(b'$2y$', 10, random_bytes, len(random_bytes))
            fresh = lib.crypt(password, salt) if salt else None
            if not fresh or lib.crypt(password, fresh) != fresh:
                raise SystemExit('BCRYPT_GENERATION_FAILED')
            updated = old[:match.start(1)] + fresh + old[match.end(1):]
            fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
            try:
                fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                if verifier.read_bytes() != old:
                    raise SystemExit('CONCURRENT_CHANGE')
                backup = directory / ('engineering-' + os.environ['RUN_ID'] + '.backup')
                bfd = os.open(backup, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
                with os.fdopen(bfd, 'wb') as fp:
                    fp.write(old)
                    fp.flush()
                    os.fsync(fp.fileno())
                if backup.read_bytes() != old:
                    raise SystemExit('BACKUP_FAILED')
                def install(data):
                    tfd, name = tempfile.mkstemp(prefix='.v70-hash-', dir=directory)
                    try:
                        with os.fdopen(tfd, 'wb') as fp:
                            os.fchown(fp.fileno(), info.st_uid, info.st_gid)
                            os.fchmod(fp.fileno(), stat.S_IMODE(info.st_mode))
                            fp.write(data)
                            fp.flush()
                            os.fsync(fp.fileno())
                        if verifier.read_bytes() not in (old, updated):
                            raise RuntimeError('CONCURRENT_CHANGE')
                        os.replace(name, verifier)
                    finally:
                        if os.path.exists(name):
                            os.unlink(name)
                install(updated)
                if not online() or verifier.read_bytes() != updated:
                    install(old)
                    if verifier.read_bytes() != old:
                        raise RuntimeError('ROLLBACK_REVIEW_REQUIRED')
                    raise RuntimeError('ONLINE_RECHECK_FAILED_OLD_HASH_RESTORED')
                print('BCRYPT10_ENGINEERING_LOGIN_VERIFIED', flush=True)
            finally:
                os.close(fd)
            PY
      - name: Independently verify guest denial and signed-in content
        env:
          WEB_USER: ${{ secrets.V70_ENGINEERING_USER }}
          WEB_PASSWORD: ${{ secrets.V70_ENGINEERING_PASSWORD }}
        run: |
          set -eu
          for file in index.html V70_macro_latest.json; do
            url="https://www.happihelp.com/v70-engineering/$file?verified=${GITHUB_RUN_ID}"
            guest=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            signed=$(curl -sS -o /dev/null -w '%{http_code}' --basic --user "$WEB_USER:$WEB_PASSWORD" "$url&signed=1")
            test "$guest" = 401 && test "$signed" = 200
            echo "EXTERNAL_PROTECTED_LOGIN_PASS $file"
          done

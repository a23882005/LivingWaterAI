# 2026/10/17｜Restore daily 11:00 TWT (V70-3-27 deployment)｜v703-site-deploy-1100.yml
name: LivingWaterAI 11h Verified V70.3 Site Deploy
on:
  schedule:
    - cron: '0 3 * * *' # Daily 11:00 Asia/Taipei (UTC 03:00)
  workflow_dispatch:
  push:
    paths:
      - '系統工程/總經V70/V70-3-27.html'
      - 'scripts/build_daily_v703_site.py'
      - '.github/workflows/v703-site-deploy-1100.yml'
      - 'data/18_macro_verification.json'
      - 'data/8_macro_supplement_verified.json'
permissions:
  contents: write
concurrency:
  group: lw-v703-site-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 18 core plus 8 supplement inputs; build V70-3-27
        run: |
          python -m py_compile scripts/build_daily_v703_site.py
          test -s data/18_macro_verification.json
          test -s data/8_macro_supplement_verified.json
          python scripts/build_daily_v703_site.py --html "系統工程/總經V70/V70-3-27.html" --out build/site
      - name: Require complete 22 of 22 scoring inputs before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('build/site/V70_macro_latest.json').read_text(encoding='utf-8'))
          v=feed['verification']
          assert feed['schema']=='V70.3/family-macro-feed-v3', 'wrong V70 feed schema'
          assert v['ready'] is True, 'V70-3-27 data incomplete; preserve existing published site'
          assert v['independentIndicators']==25
          assert v['transportIndicators']==28 and len(feed['indicators'])==28
          assert v['totalRequired']==26 and v['valid']==26
          assert v['requiredScoringIndicators']==22 and v['requiredScoringIndicatorsValidated']==22
          assert feed.get('sourceSnapshot',{}).get('macro18') and feed.get('sourceSnapshot',{}).get('macro8')
          assert feed['indicators']['m06']['status'] in ('OK','USABLE')
          m06_raw = [feed['indicators'][key] for key in ('m06_rate','m06_inf','m06_rstar','m06_output_gap')]
          assert all(row['status'] in ('OK','USABLE') and row['value'] is not None for row in m06_raw)
          rate, inflation, rstar, output_gap = [float(row['value']) for row in m06_raw]
          actual_gap = (rate - inflation) - rstar
          taylor_gap = 0.5 * (inflation - 2.0) + 0.5 * output_gap
          assert abs(float(feed['indicators']['m06']['value']) - (actual_gap - taylor_gap)) < 0.001
          assert 'm06_taylor_infl' not in feed['indicators']
          # Five public dated forecasts are display-only, not part of 22 macro scoring indicators.
          five=feed['wallStreetFive']
          assert five['schema']=='V70.3/wallstreet-five-forecast-v1'
          assert [(row['firm_id'],row['target'],row['horizon_end_date']) for row in five['forecasts']]==[
              ('goldman',8000,'2026-12-31'),('jpm',8000,'2026-12-31'),
              ('morgan',8000,'2026-12-31'),('bofa',7400,'2026-12-31'),
              ('ubs',8100,'2026-12-31')
          ]
          assert feed['sourceSnapshot']['wallstreet5']
          content=Path('build/site/index.html').read_text(encoding='utf-8')
          assert content.count('公開數字／自寫摘要／來源連結；全文未授權')==5
          assert '待總經 Task 抓取' not in content
          print('V703_WALLSTREET5_PUBLICATION_GATE_PASS',len(five['forecasts']))
          for key in ('m03_qqq','m03_spy','m03_vt'):
              row=feed['indicators'][key]
              assert row['status'] in ('OK','USABLE') and row['value'] is not None
              assert 'forward' in row['method'].lower() or 'fy1' in row['method'].lower()
              assert 'ttm' not in row['method'].lower()
          print('V70_3_27_QA_PASS',feed['asOf'])
          PY
      - name: Publish matching JSON beside official GitHub HTML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.macro18_state import atomic_write
          source=Path('build/site/V70_macro_latest.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          target=Path('系統工程/總經V70/V70_macro_latest.json')
          atomic_write(target, source.read_bytes())
          assert json.loads(target.read_text(encoding='utf-8'))==data
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add "系統工程/總經V70/V70_macro_latest.json"
            if ! git diff --cached --quiet; then
              git commit -m "data(V70-3-27): publish verified 28-indicator feed"
            fi
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "GitHub colocated feed publish failed" >&2; exit 1; fi
            sleep "$((attempt * 2))"
          done
      - name: Upload QA package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v70-3-27-qa-${{ github.run_id }}
          path: build/site/
          if-no-files-found: warn
      - name: Check deployment configuration
        env:
          LW_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          LW_USER: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          LW_PASS: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
        run: |
          test -n "$LW_HOST" && test -n "$LW_USER" && test -n "$LW_PASS" && test -n "$LW_DIR" || {
            echo "Hostinger SFTP configuration unavailable; build artifact retained"; exit 1;
          }
          case "$LW_DIR" in
            public_html|*/public_html|*/public_html/) ;;
            *) echo "::error::Site directory must end in public_html"; exit 1 ;;
          esac
      - name: Deploy validated V70-3-27 HTML and JSON via Hostinger SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          source: build/site/V70_macro_latest.json,build/site/index.html
          target: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          strip_components: 2
          overwrite: true
          timeout: 90s
          command_timeout: 90s
      - name: Verify Hostinger homepage and live JSON
        env:
          SITE_BASE_URL: ${{ vars.V703_SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          base=(os.environ.get("SITE_BASE_URL") or "https://www.happihelp.com").rstrip("/")
          expected=json.loads(Path("build/site/V70_macro_latest.json").read_text())
          for attempt in range(4):
              try:
                  stamp=expected["asOf"].replace(":","").replace("+","")
                  with urllib.request.urlopen(base+"/V70_macro_latest.json?v="+stamp,timeout=20) as response:
                      live=json.load(response)
                  with urllib.request.urlopen(base+"/?v="+stamp,timeout=20) as response:
                      page=response.read().decode("utf-8")
                  assert live["schema"]==expected["schema"]
                  assert live["asOf"]==expected["asOf"]
                  assert live["verification"]["ready"] is True
                  assert live["verification"]["independentIndicators"]==25
                  assert live["verification"]["requiredScoringIndicatorsValidated"]==22
                  assert len(live["indicators"])==28
                  assert "V70_macro_latest.json" in page
                  assert "V70-3-27" in page
                  assert live['wallStreetFive']['forecasts']==expected['wallStreetFive']['forecasts']
                  assert live['sourceSnapshot']['wallstreet5']==expected['sourceSnapshot']['wallstreet5']
                  assert page.count('公開數字／自寫摘要／來源連結；全文未授權')==5
                  assert all(('>'+format(x,',')+'<') in page for x in (8000,7400,8100))
                  print('HOSTINGER_WALLSTREET5_LIVE_PASS',len(live['wallStreetFive']['forecasts']))
                  print("HOSTINGER_LIVE_PASS",base,expected["asOf"])
                  break
              except Exception as exc:
                  if attempt==3: raise SystemExit("HOSTINGER_LIVE_VERIFY_FAILED: "+repr(exc))
                  time.sleep(12)
          PY

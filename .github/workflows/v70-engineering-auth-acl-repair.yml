name: V70 engineering scoped auth ACL repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v70-engineering-auth-acl-repair.yml']
permissions: {}
concurrency:
  group: lw-v703-site-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Grant only the web-server identity directory traversal if live readback proves it
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          LW_DIR: ${{ vars.HOSTINGER_SITE_DIRECTORY }}
          WEB_USER: ${{ secrets.V70_ENGINEERING_USER }}
          WEB_PASSWORD: ${{ secrets.V70_ENGINEERING_PASSWORD }}
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 65002
          envs: LW_DIR,WEB_USER,WEB_PASSWORD
          script: |
            set -eu
            python3 - <<'PY'
            import base64, ctypes, ctypes.util, errno, http.client, os, pwd, stat, time
            from pathlib import Path

            root = Path(os.environ['LW_DIR']).resolve(strict=True)
            home = Path.home().resolve(strict=True)
            if root.name != 'public_html' or root.parent.name != 'happihelp.com' or home not in root.parents:
                raise SystemExit('WRONG_SITE_OR_ACCOUNT')
            if root.is_symlink() or home.is_symlink():
                raise SystemExit('SYMLINK_REVIEW_REQUIRED')
            web = pwd.getpwnam('nobody')
            if web.pw_uid != 65534 or stat.S_IMODE(home.stat().st_mode) != 0o710:
                raise SystemExit('ACCOUNT_BASELINE_REVIEW_REQUIRED')
            verifier = root.parent / 'v70-engineering-auth' / 'engineering.htpasswd'
            rules = root / 'v70-engineering' / '.htaccess'
            if not verifier.is_file() or not rules.is_file() or verifier.is_symlink() or rules.is_symlink():
                raise SystemExit('VERIFIER_BASELINE_REVIEW_REQUIRED')
            if 'AuthUserFile ' + str(verifier) not in rules.read_text():
                raise SystemExit('VERIFIER_BINDING_REVIEW_REQUIRED')
            token = base64.b64encode(os.environb[b'WEB_USER'] + b':' + os.environb[b'WEB_PASSWORD']).decode()

            def request(name, signed=False):
                conn = http.client.HTTPSConnection('www.happihelp.com', timeout=12)
                headers = {'Cache-Control': 'no-cache'}
                if signed:
                    headers['Authorization'] = 'Basic ' + token
                try:
                    conn.request('GET', '/v70-engineering/' + name + '?acl_probe=' + str(time.time_ns()), headers=headers)
                    response = conn.getresponse()
                    return response.status, response.getheader('WWW-Authenticate', ''), response.read()
                finally:
                    conn.close()

            guest, realm, _ = request('index.html')
            before, _, _ = request('index.html', True)
            if guest != 401 or not realm.lower().startswith('basic ') or before != 401:
                raise SystemExit('HTTPS_BASELINE_REVIEW_REQUIRED')

            # Retain the original kernel ACL object and restore it on any failed
            # check. The sole proposed grant is traversal for uid 65534.
            lib = ctypes.CDLL(ctypes.util.find_library('acl'), use_errno=True)
            lib.acl_get_file.argtypes = [ctypes.c_char_p, ctypes.c_int]
            lib.acl_get_file.restype = ctypes.c_void_p
            lib.acl_from_text.argtypes = [ctypes.c_char_p]
            lib.acl_from_text.restype = ctypes.c_void_p
            lib.acl_set_file.argtypes = [ctypes.c_char_p, ctypes.c_int, ctypes.c_void_p]
            lib.acl_set_file.restype = ctypes.c_int
            lib.acl_free.argtypes = [ctypes.c_void_p]
            lib.acl_free.restype = ctypes.c_int
            path = os.fsencode(home)
            original = lib.acl_get_file(path, 0x8000)
            if not original:
                raise SystemExit('ACL_BASELINE_READ_FAILED')
            try:
                prior = os.getxattr(home, 'system.posix_acl_access')
            except OSError as exc:
                if exc.errno not in (errno.ENODATA, errno.ENOTSUP):
                    raise
                prior = None
            if prior is not None:
                lib.acl_free(original)
                raise SystemExit('ACCOUNT_ALREADY_HAS_ACL_REVIEW_REQUIRED')
            new = lib.acl_from_text(b'user::rwx\nuser:65534:--x\ngroup::--x\nmask::--x\nother::---\n')
            if not new:
                lib.acl_free(original)
                raise SystemExit('ACL_CONSTRUCTION_FAILED')
            applied = False
            try:
                if lib.acl_set_file(path, 0x8000, new) != 0:
                    raise OSError(ctypes.get_errno(), 'ACL_WRITE_FAILED')
                applied = True
                for filename in ('index.html', 'V70_macro_latest.json'):
                    anonymous, challenge, _ = request(filename)
                    signed, _, body = request(filename, True)
                    if anonymous != 401 or not challenge.lower().startswith('basic ') or signed != 200:
                        raise RuntimeError('HTTPS_AUTH_RECHECK_FAILED_' + str(signed))
                    if body != (root / 'v70-engineering' / filename).read_bytes():
                        raise RuntimeError('HTTPS_CONTENT_MISMATCH')
                    print('SCOPED_ACL_READBACK_PASS', filename, flush=True)
                if stat.S_IMODE(home.stat().st_mode) != 0o710:
                    raise RuntimeError('ACCOUNT_MODE_CHANGED_UNEXPECTEDLY')
            except BaseException:
                if applied:
                    if lib.acl_set_file(path, 0x8000, original) != 0:
                        raise RuntimeError('ACL_ROLLBACK_REVIEW_REQUIRED')
                    if stat.S_IMODE(home.stat().st_mode) != 0o710:
                        raise RuntimeError('ACL_ROLLBACK_REVIEW_REQUIRED')
                print('ORIGINAL_ACCOUNT_ACL_RESTORED', flush=True)
                raise
            finally:
                lib.acl_free(new)
                lib.acl_free(original)
            print('WEB_IDENTITY_TRAVERSE_ONLY_VERIFIED', flush=True)
            PY
      - name: Verify external guest denial and signed-in content
        env:
          WEB_USER: ${{ secrets.V70_ENGINEERING_USER }}
          WEB_PASSWORD: ${{ secrets.V70_ENGINEERING_PASSWORD }}
        run: |
          set -eu
          for file in index.html V70_macro_latest.json; do
            url="https://www.happihelp.com/v70-engineering/$file?acl_verified=${GITHUB_RUN_ID}"
            guest=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            signed=$(curl -sS -o /dev/null -w '%{http_code}' --basic --user "$WEB_USER:$WEB_PASSWORD" "$url&signed=1")
            test "$guest" = 401 && test "$signed" = 200
            echo "EXTERNAL_LOGIN_PASS $file"
          done
